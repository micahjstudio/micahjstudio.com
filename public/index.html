<script>

window.addEventListener('load', function() {
  console.log('Theme script loaded');
  const themeToggle = document.getElementById('theme-toggle');
  console.log('Theme toggle element:', themeToggle);
  
  if (!themeToggle) {
    console.error('Theme toggle button not found!');
    return;
  }
  
  let currentTheme = localStorage.getItem('theme') || 'light';
  console.log('Current theme:', currentTheme);

  document.body.setAttribute('data-theme', currentTheme);
  themeToggle.textContent = currentTheme === 'dark' ? '/tolight' : '/todark';

  function toggleTheme() {
    console.log('Toggle theme clicked');
    const currentTheme = document.body.getAttribute('data-theme');
    console.log('Current theme from body:', currentTheme);
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    console.log('New theme:', newTheme);

    document.body.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    themeToggle.textContent = newTheme === 'dark' ? '/tolight' : '/todark';
  }

  themeToggle.addEventListener('click', toggleTheme);
  console.log('Event listener added');
});
</script>

<style>
.flipbook-container {
  max-width: 800px !important;
  margin: 20px auto;
  text-align: center;
}

.flipbook {
  position: relative;
  width: 100%;
  height: 600px;
  margin-bottom: 20px;
  overflow: visible;
  display: flex;
  justify-content: center;
  align-items: center;
}

.page {
  position: absolute;
  width: 50%;
  height: 75%;
  transition: all 0.4s ease;
  cursor: pointer;
  border-radius: 0px;
  overflow: hidden;
}

.page img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 0px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

/* Current page - center */
.page.current {
  z-index: 10;
  left: 50%;
  transform: translateX(-50%) scale(1);
  opacity: 1;
}

/* Previous page - left side, spread out more */
.page.prev {
  z-index: 5;
  left: 5%;
  transform: translateX(0) scale(0.75);
  opacity: 0.7;
}

/* Next page - right side, spread out more */
.page.next {
  z-index: 5;
  right: 5%;
  transform: translateX(0) scale(0.75);
  opacity: 0.7;
}

/* Hidden pages */
.page.hidden {
  z-index: 1;
  left: 50%;
  transform: translateX(-50%) scale(0.3);
  opacity: 0;
  pointer-events: none;
}

.flipbook-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  font-family: var(--title-font-family);
  font-size: 0.9rem;
}

.flipbook-controls button {
  padding: 10px 20px;
  background: var(--primary-color);
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-family: var(--title-font-family);
  transition: background 0.3s;
}

.flipbook-controls button:hover {
  background: #d63ae6;
}

.flipbook-controls button:disabled {
  background: var(--mgray-color);
  cursor: not-allowed;
}

@media (max-width: 768px) {

<script>
document.addEventListener('DOMContentLoaded', function() {
  const pages = document.querySelectorAll('.page');
  const prevBtn = document.getElementById('prev-page');
  const nextBtn = document.getElementById('next-page');
  const counter = document.getElementById('page-counter');
  
  let currentPage = 0;
  
  function updateDisplay() {
    pages.forEach((page, index) => {
      page.classList.remove('current', 'prev', 'next', 'hidden');
      
      if (index === currentPage) {
        page.classList.add('current');
      } else if (index === currentPage - 1) {
        page.classList.add('prev');
      } else if (index === currentPage + 1) {
        page.classList.add('next');
      } else {
        page.classList.add('hidden');
      }
    });
    
    counter.textContent = `${currentPage + 1} / ${pages.length}`;
    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage === pages.length - 1;
  }
  
  nextBtn.addEventListener('click', () => {
    if (currentPage < pages.length - 1) {
      currentPage++;
      updateDisplay();
    }
  });
  
  prevBtn.addEventListener('click', () => {
    if (currentPage > 0) {
      currentPage--;
      updateDisplay();
    }
  });
  
  // Click handlers for navigation
  pages.forEach((page, index) => {
    page.addEventListener('click', () => {
      if (index === currentPage - 1) {
        currentPage--;
        updateDisplay();
      } else if (index === currentPage + 1) {
        currentPage++;
        updateDisplay();
      } else if (index === currentPage) {
        // Click current image for fullscreen
        const img = page.querySelector('img');
        openFullscreen(img.src);
      }
    });
  });
  
  // Fullscreen function
  function openFullscreen(imageSrc) {
    const overlay = document.createElement('div');
    overlay.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    `;
    
    const img = document.createElement('img');
    img.src = imageSrc;
    img.style.cssText = `
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 0px;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
    `;
    
    // Left arrow button
    const leftArrow = document.createElement('button');
    leftArrow.innerHTML = '←';
    leftArrow.style.cssText = `
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      border: 2px solid rgba(255,255,255,0.8);
      font-size: 2rem;
      padding: 15px 20px;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.3s;
    `;
    
    // Right arrow button
    const rightArrow = document.createElement('button');
    rightArrow.innerHTML = '→';
    rightArrow.style.cssText = `
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      border: 2px solid rgba(255,255,255,0.8);
      font-size: 2rem;
      padding: 15px 20px;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.3s;
    `;
    
    // Update arrow visibility
    function updateArrows() {
      leftArrow.style.display = currentPage > 0 ? 'block' : 'none';
      rightArrow.style.display = currentPage < pages.length - 1 ? 'block' : 'none';
    }
    
    // Arrow click handlers
    leftArrow.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentPage > 0) {
        currentPage--;
        updateDisplay();
        img.src = pages[currentPage].querySelector('img').src;
        updateArrows();
      }
    });
    
    rightArrow.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentPage < pages.length - 1) {
        currentPage++;
        updateDisplay();
        img.src = pages[currentPage].querySelector('img').src;
        updateArrows();
      }
    });
    
    // Hover effects
    leftArrow.addEventListener('mouseenter', () => {
      leftArrow.style.background = 'rgba(255,255,255,0.9)';
      leftArrow.style.color = 'black';
    });
    leftArrow.addEventListener('mouseleave', () => {
      leftArrow.style.background = 'rgba(0,0,0,0.8)';
      leftArrow.style.color = 'white';
    });
    
    rightArrow.addEventListener('mouseenter', () => {
      rightArrow.style.background = 'rgba(255,255,255,0.9)';
      rightArrow.style.color = 'black';
    });
    rightArrow.addEventListener('mouseleave', () => {
      rightArrow.style.background = 'rgba(0,0,0,0.8)';
      rightArrow.style.color = 'white';
    });
    
    overlay.appendChild(img);
    overlay.appendChild(leftArrow);
    overlay.appendChild(rightArrow);
    document.body.appendChild(overlay);
    document.body.style.overflow = 'hidden';
    
    updateArrows();
    
    // Close on overlay click (but not on arrows or image)
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        closeFullscreen();
      }
    });
    
    // Close function
    const closeFullscreen = () => {
      document.body.style.overflow = '';
      document.body.removeChild(overlay);
      document.removeEventListener('keydown', handleKeydown);
    };
    
    // Keyboard navigation
    const handleKeydown = function(e) {
      if (e.key === 'Escape') {
        closeFullscreen();
      } else if (e.key === 'ArrowRight' && currentPage < pages.length - 1) {
        currentPage++;
        updateDisplay();
        img.src = pages[currentPage].querySelector('img').src;
        updateArrows();
      } else if (e.key === 'ArrowLeft' && currentPage > 0) {
        currentPage--;
        updateDisplay();
        img.src = pages[currentPage].querySelector('img').src;
        updateArrows();
      }
    };
    document.addEventListener('keydown', handleKeydown);
  }
  
  updateDisplay();
});
</script>

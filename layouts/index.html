{{ define "main" }}
  <div class="breadcrumb homepage-breadcrumb">🏠 /home<hr></div>

  {{ .Content }}

  <div class="posts-list">
    {{ range .Site.RegularPages }}
      <div class="post-title">
        <a href="{{ .Permalink }}">- {{ .Title }}</a>
        <small>{{ .Date.Format "2006.01.02" }}</small>
      </div>
    {{ end }}
  </div>

  <script src="{{ .Site.BaseURL | absURL }}js/portfolio.js"></script>

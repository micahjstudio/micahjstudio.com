<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
{{ $theme := resources.Get "css/main.css" }}
{{ if $theme }}
  <link rel="stylesheet" href="{{ $theme.RelPermalink }}">
{{ end }}
<style>
/* Force font loading */
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap');
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

/* Apply fonts with highest specificity */
html, body, * {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', sans-serif !important;
}

/* Hide page titles */
.singleTitle {
  display: none !important;
}

html body .singleTitle {
  display: none !important;
}

.overlay-text small {
  margin-top: 0 !important;
  margin-bottom: 0 !important;
}

/* Add bottom spacing to all pages */
body {
  padding-bottom: 80px !important;
  margin-top: 70px !important;
}

main, article, .content {
  padding-bottom: 80px !important;
  padding-top: 40px !important;
}

.main-header, .main-header *, .post-title, .post-title *, .breadcrumb, .index-title {
  font-family: 'Fira Code', 'SF Mono', Monaco, Inconsolata, 'Roboto Mono', monospace !important;
}

/* Navigation styles */
html body .main-header nav,
.main-header nav,
header.main-header nav {
  display: flex !important;
  flex-direction: row !important;
  flex-wrap: nowrap !important;
  justify-content: flex-start !important;
  align-items: center !important;
  list-style: none !important;
  margin: 0 !important;
  padding: 0 !important;
}

html body .main-header nav li,
.main-header nav li,
header.main-header nav li {
  display: inline-block !important;
  margin-right: 14px !important;
  margin-bottom: 0 !important;
  margin-top: 0 !important;
  float: none !important;
  clear: none !important;
  width: auto !important;
  height: auto !important;
}

/* Link colors */
a {
  color: #181818 !important;
  text-decoration: none !important;
}

a:hover {
  color: #ec42ff !important;
}

.main-header nav li a {
  color: #181818 !important;
  font-family: 'Fira Code', monospace !important;
}

.main-header nav li a:hover {
  color: #ec42ff !important;
}

/* Theme toggle */
#theme-toggle {
  cursor: pointer !important;
  padding: 8px 4px !important;
  min-height: 44px !important;
  min-width: 44px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  transition: all 0.2s ease !important;
  border-radius: 4px !important;
}

#theme-toggle:hover {
  background-color: rgba(236, 66, 255, 0.1) !important;
}

/* Theme colors */
body[data-theme="dark"] {
  --background-color: #181818 !important;
  --text-color: #FFFFFF !important;
  --gray-color: #464646 !important;
  --code-color: #828282 !important;
  background-color: #181818 !important;
  color: #FFFFFF !important;
}

body[data-theme="light"] {
  --background-color: #FFFFFF !important;
  --text-color: #181818 !important;
  --gray-color: #f2f2f2 !important;
  --code-color: #828282 !important;
  background-color: #FFFFFF !important;
  color: #181818 !important;
}

/* Dark theme links */
body[data-theme="dark"] a {
  color: #FFFFFF !important;
}

body[data-theme="dark"] a:hover {
  color: #ec42ff !important;
}

body[data-theme="dark"] .main-header nav li a {
  color: #FFFFFF !important;
}

body[data-theme="dark"] .main-header nav li a:hover {
  color: #ec42ff !important;
}

/* Light theme links */
body[data-theme="light"] a {
  color: #181818 !important;
}

body[data-theme="light"] a:hover {
  color: #ec42ff !important;
}

body[data-theme="light"] .main-header nav li a {
  color: #181818 !important;
}

body[data-theme="light"] .main-header nav li a:hover {
  color: #ec42ff !important;
}

/* Portfolio grid */
html body .portfolio .portfolio-grid {
  display: grid !important;
  grid-template-columns: repeat(3, 1fr) !important;
  gap: 20px !important;
  margin-top: 10px !important;
}

html body .portfolio .portfolio-grid .portfolio-item img {
  width: 100% !important;
  max-width: 300px !important;
  height: 200px !important;
  display: block !important;
  object-fit: cover !important;
  border-radius: 4px !important;
  cursor: pointer !important;
}

/* Mobile styles */
@media (max-width: 768px) {
  body {
    margin-top: 20px !important;
    padding-top: 0 !important;
  }
  
  .container, body {
    width: 100% !important;
    min-width: unset !important;
    padding: 0 20px !important;
  }
  
  .main-header {
    width: 100% !important;
    left: 0 !important;
    transform: none !important;
    padding: 12px 20px !important;
  }
  
  html body .main-header nav,
  .main-header nav {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
  }
  
  html body .main-header nav li,
  .main-header nav li {
    margin-right: 15px !important;
    display: inline-block !important;
    width: auto !important;
  }
  
  .main-header nav li a,
  #theme-toggle {
    padding: 8px 4px !important;
    min-height: 44px !important;
    display: flex !important;
    align-items: center !important;
  }
  
  html body .portfolio .portfolio-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 15px !important;
  }
  
  html body .portfolio .portfolio-grid .portfolio-item img {
    max-width: 100% !important;
    height: 150px !important;
  }
}

@media (max-width: 600px) {
  html body .portfolio .portfolio-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 15px !important;
  }
}

@media (max-width: 375px) {
  html body .portfolio .portfolio-grid {
    grid-template-columns: 1fr !important;
    gap: 10px !important;
  }
}

/* Breadcrumb adjustments */
.breadcrumb {
  margin-top: -25px !important;
}

html body .homepage-breadcrumb {
  margin-top: -25px !important;
}

/* Heading colors */
html body[data-theme="light"] h1,
html body[data-theme="light"] h2, 
html body[data-theme="light"] h3,
html body[data-theme="light"] h4,
html body[data-theme="light"] h5,
html body[data-theme="light"] h6 {
  color: #181818 !important;
}

html body[data-theme="dark"] h1,
html body[data-theme="dark"] h2,
html body[data-theme="dark"] h3,
html body[data-theme="dark"] h4,
html body[data-theme="dark"] h5,
html body[data-theme="dark"] h6 {
  color: #FFFFFF !important;
}
</style>

<script defer src="/js/portfolio.js"></script>
